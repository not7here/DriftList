name: Build Windows portable app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:portable
      - uses: actions/upload-artifact@v4
        with:
          name: DriftList-Windows-Portable
          path: release/*.exe
